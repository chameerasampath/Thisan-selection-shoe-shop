<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Thisan Selection - Admin</title>

<style>
*{box-sizing:border-box}

body{
 font-family:Arial;
 background:#f2f2f2;
 margin:0;
 padding:20px;
}

.container{
 max-width:700px;
 margin:auto;
}

.box{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:20px;
 box-shadow:0 2px 8px #0002;
}

h1{text-align:center}

input,button{
 width:100%;
 padding:12px;
 margin-top:10px;
 border-radius:8px;
 border:1px solid #ccc;
}

button{
 background:#111;
 color:white;
 cursor:pointer;
 border:0;
}

.logout{
 background:#b00020;
}

.product{
 background:#fafafa;
 padding:12px;
 margin-top:15px;
 border-radius:10px;
 border:1px solid #ddd;
}

.product img{
 width:100%;
 max-height:250px;
 object-fit:contain;
}

.delete{
 background:#d00000;
}

.edit{
 background:#444;
}

#adminPanel{display:none}
</style>
</head>

<body>

<div class="container">

<h1>🛠 Thisan Selection Admin</h1>

<div id="loginBox" class="box">

<h2>Admin Login</h2>

<input
 id="email"
 type="email"
 placeholder="Email"
>

<input
 id="password"
 type="password"
 placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<p id="loginMessage"></p>

</div>


<div id="adminPanel">

<div class="box">

<h2>Add Product</h2>

<input
 id="productName"
 type="text"
 placeholder="Product name"
>

<input
 id="productPrice"
 type="number"
 placeholder="Price"
>

<input
 id="productImage"
 type="file"
 accept="image/*"
>

<button id="addBtn">
Add Product
</button>

<p id="message"></p>

</div>


<div class="box">

<h2>Products</h2>

<div id="productList">
Loading...
</div>

</div>

<button class="logout" id="logoutBtn">
Logout
</button>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 updateDoc,
 deleteDoc,
 doc,
 serverTimestamp,
 query,
 orderBy
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

 apiKey: "AIzaSyB8phN-4a8nDIhmpf5MlwsV5-_2yPwXEEk",

 authDomain:
 "thisan-shoe-ahangama.firebaseapp.com",

 projectId:
 "thisan-shoe-ahangama",

 storageBucket:
 "thisan-shoe-ahangama.firebasestorage.app",

 messagingSenderId:
 "552970131351",

 appId:
 "1:552970131:web:9917c56ca7435ec62cd6d2",

 measurementId:
 "G-LP21L8JN5P"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


const loginBox=document.getElementById("loginBox");
const adminPanel=document.getElementById("adminPanel");


document.getElementById("loginBtn")
.addEventListener("click",async()=>{

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 try{

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(error){

  document.getElementById("loginMessage")
  .textContent="Login failed.";

 }

});


onAuthStateChanged(auth,(user)=>{

 if(user){

  loginBox.style.display="none";
  adminPanel.style.display="block";

  loadProducts();

 }else{

  loginBox.style.display="block";
  adminPanel.style.display="none";

 }

});


document.getElementById("logoutBtn")
.addEventListener("click",()=>signOut(auth));


function compressImage(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=e=>{

   const img=new Image();

   img.onload=()=>{

    const maxWidth=800;

    let width=img.width;
    let height=img.height;

    if(width>maxWidth){

     height=
      height*(maxWidth/width);

     width=maxWidth;

    }

    const canvas=document.createElement("canvas");

    canvas.width=width;
    canvas.height=height;

    const ctx=canvas.getContext("2d");

    ctx.drawImage(
     img,
     0,
     0,
     width,
     height
    );

    resolve(
     canvas.toDataURL(
      "image/jpeg",
      0.7
     )
    );

   };

   img.onerror=reject;

   img.src=e.target.result;

  };

  reader.onerror=reject;

  reader.readAsDataURL(file);

 });

}


document.getElementById("addBtn")
.addEventListener("click",async()=>{

 const name=
 document.getElementById("productName")
 .value.trim();

 const price=
 document.getElementById("productPrice")
 .value.trim();

 const file=
 document.getElementById("productImage")
 .files[0];

 if(!name || !price || !file){

  alert("Name, price and photo are required.");

  return;

 }

 try{

  const image=await compressImage(file);

  await addDoc(
   collection(db,"products"),
   {
    name:name,
    price:price,
    image:image,
    createdAt:serverTimestamp()
   }
  );

  document.getElementById("productName").value="";
  document.getElementById("productPrice").value="";
  document.getElementById("productImage").value="";

  document.getElementById("message")
  .textContent="Product added successfully.";

  loadProducts();

 }catch(error){

  console.error(error);

  alert("Could not add product.");

 }

});


async function loadProducts(){

 const list=document.getElementById("productList");

 list.innerHTML="Loading...";

 try{

  const q=query(
   collection(db,"products"),
   orderBy("createdAt","desc")
  );

  const snap=await getDocs(q);

  list.innerHTML="";

  if(snap.empty){

   list.innerHTML="No products.";

   return;

  }

  snap.forEach(item=>{

   const p=item.data();

   const div=document.createElement("div");

   div.className="product";

   div.innerHTML=`

    <img src="${p.image || ''}">

    <h3>${p.name || ''}</h3>

    <p>Rs. ${p.price || ''}</p>

    <button class="edit">
     Edit
    </button>

    <button class="delete">
     Delete
    </button>

   `;


   div.querySelector(".delete")
   .addEventListener("click",async()=>{

    if(!confirm("Delete this product?"))
     return;

    await deleteDoc(
     doc(db,"products",item.id)
    );

    loadProducts();

   });


   div.querySelector(".edit")
   .addEventListener("click",async()=>{

    const newName=
    prompt(
     "Product name:",
     p.name || ""
    );

    if(newName===null)return;

    const newPrice=
    prompt(
     "Price:",
     p.price || ""
    );

    if(newPrice===null)return;

    await updateDoc(
     doc(db,"products",item.id),
     {
      name:newName,
      price:newPrice
     }
    );

    loadProducts();

   });


   list.appendChild(div);

  });

 }catch(error){

  console.error(error);

  list.innerHTML=
   "Could not load products.";

 }

}

</script>

</body>
</html>
