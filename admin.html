<title>Thisan Selection - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 15px;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  margin-top:8px;
}

.login-btn,
.add-btn{
  background:#111;
  color:white;
  width:100%;
}

.logout-btn{
  background:#b00020;
  color:white;
}

.product{
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.product img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

.product-info{
  flex:1;
}

.product-info h3{
  margin-bottom:6px;
}

.edit-btn{
  background:#222;
  color:white;
  margin-right:5px;
}

.delete-btn{
  background:#d32f2f;
  color:white;
}

#loginMessage,
#message{
  margin-top:12px;
  text-align:center;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .product{
    align-items:flex-start;
  }

  .product img{
    width:75px;
    height:75px;
  }

  .product button{
    font-size:13px;
    padding:8px 10px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h1>Admin Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="hidden">

    <div class="card">

      <h1>Thisan Selection Admin</h1>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </div>


    <!-- ADD PRODUCT -->
    <div class="card">

      <h2>Add Product</h2>

      <input
        type="text"
        id="productName"
        placeholder="Product name"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="Price (optional)"
      >

      <input
        type="file"
        id="productImage"
        accept="image/*"
      >

      <button class="add-btn" id="addBtn">
        Add Product
      </button>

      <p id="message"></p>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <h2>Products</h2>

      <div id="productsList">
        Loading...
      </div>

    </div>

  </div>

</div>

/* =========================
   LOGIN
========================= */

loginBtn.addEventListener("click", async () => {

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  if(!email || !password){

    loginMessage.textContent =
    "Please enter email and password.";

    return;
  }

  loginMessage.textContent =
  "Logging in...";

  try{

    const result =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if(result.user.uid !== ADMIN_UID){

      await signOut(auth);

      loginMessage.textContent =
      "You are not authorized as admin.";

      return;
    }

    loginMessage.textContent =
    "";

  }catch(error){

    console.error(error);

    loginMessage.textContent =
    error.code + " - " + error.message;
  }

});


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async (user) => {

  if(user && user.uid === ADMIN_UID){

    loginSection.classList.add("hidden");

    adminSection.classList.remove("hidden");

    loadProducts();

  }else{

    loginSection.classList.remove("hidden");

    adminSection.classList.add("hidden");

  }

});
