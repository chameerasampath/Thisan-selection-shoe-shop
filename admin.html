<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thisan Selection - Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:700px;
  margin:30px auto;
  padding:20px;
}

.box{
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 15px #0002;
  margin-bottom:20px;
}

h2{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

input[type="file"]{
  background:#fafafa;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  opacity:.85;
}

.logout{
  background:#b00020;
}

.product{
  border:1px solid #ddd;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}

.product img{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:12px;
}

.product h3{
  margin-bottom:6px;
}

.product-price{
  font-weight:bold;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  margin:0;
}

.edit{
  background:#555;
}

.delete{
  background:#c62828;
}

#adminPanel{
  display:none;
}

#loginBox{
  max-width:450px;
  margin:50px auto;
}

.message{
  text-align:center;
  margin-top:12px;
  font-weight:bold;
}

.note{
  color:#777;
  font-size:14px;
  margin-bottom:12px;
}

</style>

</head>

<body>


<header>

  <h1>Thisan Selection</h1>

  <p>Admin Panel</p>

</header>


<!-- LOGIN -->

<div id="loginBox" class="box">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="loginBtn">
    Login
  </button>

  <div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel">

  <div class="container">


    <!-- ADD PRODUCT -->

    <div class="box">

      <h2>Add Product</h2>

      <p class="note">
        Product name and photo are required.
        Price is optional.
      </p>

      <input
        type="text"
        id="productName"
        placeholder="Product name"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="Price (optional)"
        min="0"
      >

      <input
        type="file"
        id="productImage"
        accept="image/*"
      >

      <button id="addBtn">
        Add Product
      </button>

      <div id="addMessage" class="message"></div>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <h2>Products</h2>

      <div id="productList">
        Loading...
      </div>

    </div>


    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>

</div>


<script type="module">


import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyB8BphN-4a8nDIhmpf5MlwsV5-_2yPwXEEk",

  authDomain:
  "thisan-shoe-ahangama.firebaseapp.com",

  projectId:
  "thisan-shoe-ahangama",

  storageBucket:
  "thisan-shoe-ahangama.firebasestorage.app",

  messagingSenderId:
  "552970131351",

  appId:
  "1:552970131:web:9917c56ca7435ec62cd6d2",

  measurementId:
  "G-LP21L8JN5P"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"s9cPLQO3vPTIVExTyBeHRyGdn0V2";


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const addMessage =
document.getElementById("addMessage");

const productList =
document.getElementById("productList");


/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click", async()=>{

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  if(!email || !password){

    loginMessage.textContent =
    "Enter email and password.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

  console.error(error);

  loginMessage.textContent =
  error.code + " - " + error.message;

}


});


/* AUTH CHECK */

onAuthStateChanged(auth, user=>{

  if(
    user &&
    user.uid === ADMIN_UID
  ){

    loginBox.style.display="none";

    adminPanel.style.display="block";

    loadProducts();

  }

  else{

    loginBox.style.display="block";

    adminPanel.style.display="none";

  }

});


/* IMAGE COMPRESS */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
    new FileReader();

    reader.onload = event=>{

      const img =
      new Image();

      img.onload = ()=>{

        const canvas =
        document.createElement("canvas");

        const maxWidth = 900;

        let width =
        img.width;

        let height =
        img.height;


        if(width > maxWidth){

          height =
          height * maxWidth / width;

          width =
          maxWidth;

        }


        canvas.width =
        width;

        canvas.height =
        height;


        const ctx =
        canvas.getContext("2d");


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.75
          )
        );

      };


      img.onerror =
      reject;

      img.src =
      event.target.result;

    };


    reader.onerror =
    reject;

    reader.readAsDataURL(file);

  });

}


/* ADD PRODUCT */

document
.getElementById("addBtn")
.addEventListener("click", async()=>{

  const name =
  document
  .getElementById("productName")
  .value
  .trim();


  const price =
  document
  .getElementById("productPrice")
  .value
  .trim();


  const imageFile =
  document
  .getElementById("productImage")
  .files[0];


  if(!name){

    addMessage.textContent =
    "Product name is required.";

    return;

  }


  if(!imageFile){

    addMessage.textContent =
    "Please select a product photo.";

    return;

  }


  try{

    addMessage.textContent =
    "Uploading...";


    const image =
    await compressImage(imageFile);


    await addDoc(
      collection(db,"products"),
      {
        name:name,

        price:price || "",

        image:image,

        createdAt:
        serverTimestamp()
      }
    );


    document
    .getElementById("productName")
    .value="";


    document
    .getElementById("productPrice")
    .value="";


    document
    .getElementById("productImage")
    .value="";


    addMessage.textContent =
    "Product added successfully!";


    loadProducts();

  }

  catch(error){

    console.error(error);

    addMessage.textContent =
    "Upload failed.";

  }

});


/* LOAD PRODUCTS */

async function loadProducts(){

  try{

    const q =
    query(
      collection(db,"products"),
      orderBy("createdAt","desc")
    );


    const snap =
    await getDocs(q);


    productList.innerHTML="";


    if(snap.empty){

      productList.innerHTML =
      "<p>No products yet.</p>";

      return;

    }


    snap.forEach(docSnap=>{

      const p =
      docSnap.data();


      const div =
      document.createElement("div");

      div.className =
      "product";


      const img =
      document.createElement("img");

      img.src =
      p.image || "";


      const title =
      document.createElement("h3");

      title.textContent =
      p.name || "";


      const price =
      document.createElement("div");

      price.className =
      "product-price";


      if(p.price){

        price.textContent =
        "Rs. " + p.price;

      }
      else{

        price.textContent =
        "Price not added";

      }


      const actions =
      document.createElement("div");

      actions.className =
      "actions";


      const editBtn =
      document.createElement("button");

      editBtn.className =
      "edit";

      editBtn.textContent =
      "Edit";


      const deleteBtn =
      document.createElement("button");

      deleteBtn.className =
      "delete";

      deleteBtn.textContent =
      "Delete";


      editBtn.onclick =
      ()=>editProduct(
        docSnap.id,
        p
      );


      deleteBtn.onclick =
      ()=>deleteProduct(
        docSnap.id
      );


      actions.appendChild(editBtn);

      actions.appendChild(deleteBtn);


      div.appendChild(img);

      div.appendChild(title);

      div.appendChild(price);

      div.appendChild(actions);


      productList.appendChild(div);

    });

  }

  catch(error){

    console.error(error);

    productList.innerHTML =
    "<p>Could not load products.</p>";

  }

}


/* EDIT */

async function editProduct(id,p){

  const newName =
  prompt(
    "Product name:",
    p.name || ""
  );


  if(newName === null){
    return;
  }


  const newPrice =
  prompt(
    "Price (leave empty if no price):",
    p.price || ""
  );


  if(newPrice === null){
    return;
  }


  try{

    await updateDoc(
      doc(db,"products",id),
      {
        name:newName.trim(),

        price:newPrice.trim()
      }
    );


    loadProducts();

  }

  catch(error){

    console.error(error);

    alert(
      "Could not update product."
    );

  }

}


/* DELETE */

async function deleteProduct(id){

  const confirmDelete =
  confirm(
    "Delete this product?"
  );


  if(!confirmDelete){
    return;
  }


  try{

    await deleteDoc(
      doc(db,"products",id)
    );


    loadProducts();

  }

  catch(error){

    console.error(error);

    alert(
      "Could not delete product."
    );

  }

}


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener("click", async()=>{

  await signOut(auth);

});


</script>

</body>
</html>
