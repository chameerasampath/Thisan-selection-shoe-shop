<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Thisan Selection - Admin</title>

<style>
*{box-sizing:border-box}
body{
font-family:Arial;
background:#f3f3f3;
margin:0;
padding:20px
}
.container{
max-width:700px;
margin:auto
}
.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 12px #0001
}
input,button{
width:100%;
padding:13px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px
}
button{
background:#111;
color:white;
border:0;
font-weight:bold
}
.product{
display:flex;
gap:15px;
align-items:center;
padding:12px;
border-bottom:1px solid #ddd
}
.product img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px
}
.delete{
background:#e53935;
width:auto;
padding:9px 13px
}
#panel{display:none}
</style>
</head>

<body>

<div class="container">

<div id="login" class="box">
<h2>Admin Login</h2>

<input
id="password"
type="password"
placeholder="Admin password">

<button onclick="login()">LOGIN</button>

<p id="loginMsg"></p>
</div>


<div id="panel">

<div class="box">

<h2>Add Product</h2>

<input
id="name"
placeholder="Product name">

<input
id="price"
placeholder="Price">

<input
id="photo"
type="file"
accept="image/*">

<button onclick="addProduct()">
ADD PRODUCT
</button>

<p id="msg"></p>

</div>


<div class="box">

<h2>Products</h2>

<div id="list">
Loading...
</div>

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyB8phN-4a8nDIhmpf5MlwsV5-_2yPwXEEk",

authDomain:
"thisan-shoe-ahangama.firebaseapp.com",

projectId:
"thisan-shoe-ahangama",

storageBucket:
"thisan-shoe-ahangama.firebasestorage.app",

messagingSenderId:
"552970131351",

appId:
"1:552970131351:web:9917c56ca7435ec62cd6d2",

measurementId:
"G-LP21L8JN5P"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* CHANGE THIS PASSWORD */
const ADMIN_PASSWORD = "Thisan1234";


window.login = function(){

const password =
document.getElementById("password").value;

if(password === ADMIN_PASSWORD){

document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";

loadProducts();

}else{

document.getElementById("loginMsg").innerText =
"Wrong password.";

}

};


/* Compress image */

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const max = 900;

let width = img.width;
let height = img.height;

if(width > max){

height = height * max / width;
width = max;

}

const canvas =
document.createElement("canvas");

canvas.width = width;
canvas.height = height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(img,0,0,width,height);

resolve(
canvas.toDataURL("image/jpeg",0.65)
);

};

img.src = e.target.result;

};

reader.onerror = reject;

reader.readAsDataURL(file);

});

}


/* Add product */

window.addProduct = async function(){

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value.trim();

const file =
document.getElementById("photo").files[0];

const msg =
document.getElementById("msg");

if(!name || !price || !file){

msg.innerText =
"Name, price and photo are required.";

return;

}

try{

msg.innerText="Uploading...";

const image =
await compressImage(file);

await addDoc(
collection(db,"products"),
{
name:name,
price:price,
image:image,
createdAt:Date.now()
}
);

msg.innerText="Product added successfully!";

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("photo").value="";

loadProducts();

}catch(error){

console.error(error);

msg.innerText =
"Error: "+error.message;

}

};


/* Show products */

async function loadProducts(){

const list =
document.getElementById("list");

list.innerHTML="Loading...";

const snapshot =
await getDocs(collection(db,"products"));

list.innerHTML="";

snapshot.forEach(item=>{

const p=item.data();

const div =
document.createElement("div");

div.className="product";

div.innerHTML=`

<img src="${p.image}">

<div style="flex:1">
<b>${p.name}</b><br>
Rs. ${p.price}
</div>

<button
class="delete"
data-id="${item.id}">
DELETE
</button>

`;

div.querySelector(".delete")
.addEventListener("click",()=>{

deleteProduct(item.id);

});

list.appendChild(div);

});

}


/* Delete */

async function deleteProduct(id){

if(!confirm("Delete this product?"))
return;

await deleteDoc(
doc(db,"products",id)
);

loadProducts();

}

</script>

</body>
</html>
