<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thisan Selection - Ahangama</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:white;text-align:center;padding:22px 15px}
header h1{font-size:28px}
header p{margin-top:6px;color:#ddd}
.contact{background:white;padding:15px;text-align:center}
.contact a{
 display:inline-block;margin:5px;padding:10px 15px;
 border-radius:8px;text-decoration:none;font-weight:bold
}
.call{background:#111;color:white}
.whatsapp{background:#25D366;color:white}
.location{background:#ddd;color:#111}

.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:15px;padding:20px;max-width:1100px;margin:auto
}
.card{
 background:white;border-radius:12px;overflow:hidden;
 box-shadow:0 2px 8px #0002
}
.card img{width:100%;height:210px;object-fit:cover}
.info{padding:12px}
.info h3{font-size:17px}
.price{font-weight:bold;margin-top:7px;font-size:18px}

footer{
 text-align:center;background:#111;color:white;
 padding:20px;margin-top:20px
}
</style>
</head>

<body>

<header>
<h1>Thisan Selection</h1>
<p>Matara Road, Ahangama</p>
</header>

<div class="contact">
<a class="call" href="tel:0774250707">📞 077 425 0707</a>
<a class="call" href="tel:0774250700">📞 077 425 0700</a>

<a class="whatsapp"
href="https://wa.me/94774250707">WhatsApp 1</a>

<a class="whatsapp"
href="https://wa.me/94774250700">WhatsApp 2</a>

<a class="location"
href="https://maps.app.goo.gl/pR6wXTMdVNSAYVxs6"
target="_blank">📍 Location</a>

<p style="margin-top:10px">
🕘 Open: 9:30 AM - 8:00 PM
</p>
</div>

<h2 style="text-align:center;margin:20px 0 5px">
Our Products
</h2>

<div id="products" class="products">
<p style="text-align:center">Loading products...</p>
</div>

<footer>
<p>© 2026 Thisan Selection - Ahangama</p>
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getFirestore,
 collection,
 getDocs,
 query,
 orderBy
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyB8phN-4a8nDIhmpf5MlwsV5-_2yPwXEEk",
 authDomain: "thisan-shoe-ahangama.firebaseapp.com",
 projectId: "thisan-shoe-ahangama",
 storageBucket: "thisan-shoe-ahangama.firebasestorage.app",
 messagingSenderId: "552970131351",
 appId: "1:552970131:web:9917c56ca7435ec62cd6d2",
 measurementId: "G-LP21L8JN5P"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const box = document.getElementById("products");

async function loadProducts(){

 try{

  const q = query(
   collection(db,"products"),
   orderBy("createdAt","desc")
  );

  const snap = await getDocs(q);

  box.innerHTML="";

  if(snap.empty){
   box.innerHTML="<p>No products available yet.</p>";
   return;
  }

  snap.forEach(docSnap=>{

   const p=docSnap.data();

   const card=document.createElement("div");
   card.className="card";

   card.innerHTML=`
    <img src="${p.image || ''}" alt="${p.name || 'Product'}">
    <div class="info">
      <h3>${p.name || ''}</h3>
      <div class="price">${p.price ? "Rs. "+p.price : ""}</div>
    </div>
   `;

   box.appendChild(card);

  });

 }catch(error){

  console.error(error);

  box.innerHTML="<p>Products could not be loaded.</p>";

 }

}

loadProducts();

</script>

</body>
</html>
